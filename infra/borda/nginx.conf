# Borda do Inóxio.
# Repassa por SNI sem abrir o TLS e termina só o acesso por IP.
# Tudo o que muda entre ambientes está em /etc/nginx/borda/ (ambientes/<nome>/).
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    include /etc/nginx/borda/stream.conf;

    map $ssl_preread_server_name $destino {
        default coabitante;
        ""      inoxio;
        include /etc/nginx/borda/nomes-inoxio.conf;
    }

    server {
        include /etc/nginx/borda/escuta-stream.conf;
        ssl_preread on;
        proxy_pass $destino;
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    include /etc/nginx/borda/http.conf;

    server {
        include /etc/nginx/borda/escuta-http.conf;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 127.0.0.1:9443 ssl proxy_protocol;
        http2 on;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        include /etc/nginx/borda/certificado.conf;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:inoxio:10m;

        error_page 502 503 504 /em-construcao.html;
        location = /em-construcao.html {
            root /usr/share/nginx/borda;
            internal;
        }

        location / {
            proxy_pass http://inoxio_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90s;
        }
    }
}
