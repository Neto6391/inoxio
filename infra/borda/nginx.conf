# Borda do Inóxio.
# Repassa por SNI sem abrir o TLS e termina só o acesso por IP. No acesso por IP,
# serve o React direto do disco e repassa ao app só /api/ e /saude.
# Tudo o que muda entre ambientes está em /etc/nginx/borda/ (ambientes/<nome>/).
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    include /etc/nginx/borda/stream.conf;

    map $ssl_preread_server_name $destino {
        default coabitante;
        ""      inoxio;
        include /etc/nginx/borda/nomes-inoxio.conf;
    }

    server {
        include /etc/nginx/borda/escuta-stream.conf;
        ssl_preread on;
        proxy_pass $destino;
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    include /etc/nginx/borda/http.conf;

    # Limite por IP do cliente (o real, vindo do proxy_protocol). O login tem um
    # limite próprio, mais apertado; o geral cobre a página, os assets e a API.
    limit_req_zone $binary_remote_addr zone=inoxio_geral:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=inoxio_login:10m rate=10r/m;
    limit_req_status 429;

    # A versão publicada é o SHA do commit: o deploy troca o link "atual" para a pasta
    # <sha> do build novo, e o $realpath_root segue o link a cada requisição. Assim a
    # borda sabe a versão sem ser recarregada (o deploy não tem acesso a ela).
    map $realpath_root $inoxio_versao {
        "~/(?<sha>[0-9a-f]{40})$" $sha;
        default "";
    }

    server {
        include /etc/nginx/borda/escuta-http.conf;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 127.0.0.1:9443 ssl proxy_protocol;
        http2 on;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        include /etc/nginx/borda/certificado.conf;
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:inoxio:10m;

        # O mesmo caminho do host: o link "atual" aponta para /home/inoxio/frontend/<sha>.
        root /home/inoxio/frontend/atual;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;

        error_page 502 503 504 /em-construcao.html;
        location = /em-construcao.html {
            root /usr/share/nginx/borda;
            internal;
        }

        # O frontend espera erro em JSON, com a mensagem no campo "erro".
        error_page 429 = @limite;
        location @limite {
            default_type application/json;
            return 429 '{"erro":"Muitas requisições. Tente de novo em instantes."}';
        }

        # Com o app fora (um deploy reiniciando, por exemplo), a página continua de pé
        # e a API responde em JSON, que é o que a tela sabe mostrar.
        location @fora_do_ar {
            default_type application/json;
            return 503 '{"erro":"O Inóxio está reiniciando. Tente de novo em instantes."}';
        }

        # Um error_page no location apaga os herdados do server: o 429 vai de novo.
        location = /api/login {
            limit_req zone=inoxio_login burst=5 nodelay;
            error_page 429 = @limite;
            error_page 502 503 504 = @fora_do_ar;
            proxy_pass http://inoxio_app;
            proxy_hide_header X-Inoxio-Versao;
            add_header X-Inoxio-Versao $inoxio_versao always;
        }

        location /api/ {
            limit_req zone=inoxio_geral burst=40 nodelay;
            error_page 429 = @limite;
            error_page 502 503 504 = @fora_do_ar;
            proxy_pass http://inoxio_app;
            # Uma fonte só para a versão: a da borda.
            proxy_hide_header X-Inoxio-Versao;
            add_header X-Inoxio-Versao $inoxio_versao always;
        }

        location = /saude {
            proxy_pass http://inoxio_app;
        }

        # Os nomes levam o hash do conteúdo: o arquivo nunca muda sob o mesmo nome.
        location /assets/ {
            limit_req zone=inoxio_geral burst=40 nodelay;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy no-referrer;
        }

        # Qualquer outra rota é do React; ele decide o que mostrar. O antd injeta estilos
        # em tempo de execução: cada resposta leva um nonce novo, o mesmo no cabeçalho
        # CSP e na meta tag que o React repassa ao ConfigProvider.
        location / {
            limit_req zone=inoxio_geral burst=40 nodelay;
            try_files /index.html =503;
            sub_filter_once off;
            sub_filter __CSP_NONCE__ $request_id;
            sub_filter __VERSAO__ $inoxio_versao;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'" always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
    }
}
