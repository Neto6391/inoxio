# O app falso do ensaio: ecoa o que a borda repassa e, como o app antigo, manda a
# própria versão, que a borda tem de esconder.
server {
    listen 8100;
    default_type text/plain;
    add_header X-Inoxio-Versao velha always;

    location = /saude {
        return 200 "ok";
    }

    location / {
        return 200 "Caminho: $request_uri\nX-Forwarded-For: $http_x_forwarded_for\nX-Forwarded-Proto: $http_x_forwarded_proto\n";
    }
}
