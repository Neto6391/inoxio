[project]
name = "inoxio"
version = "0.1.0"
description = "Investigador de indicadores suspeitos: veredito por regra fixa e explicação por IA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=0.3,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
inoxio = "inoxio.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inoxio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Specs e planos são registro: o ruff não reescreve o código de exemplo deles.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]
